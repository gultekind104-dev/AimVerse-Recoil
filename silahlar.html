/* =========================================================
   YARDIMCI FONKSİYONLAR
   ========================================================= */

function safeNumber(value){

  const number = Number(value);

  if(!Number.isFinite(number)){
    return 0;
  }

  return Math.max(0,Math.min(100,number));
}


function recoilClass(recoil){

  if(recoil === "LOW"){
    return "low";
  }

  if(recoil === "HIGH"){
    return "high";
  }

  return "medium";
}


function scoreHTML(label,value){

  const safe = safeNumber(value);

  return `
    <div class="score-line">

      <span>${label}</span>

      <div class="bar">
        <i style="width:${safe}%"></i>
      </div>

      <span class="score-value">
        ${safe}
      </span>

    </div>
  `;
}


function modalScoreHTML(label,value){

  const safe = safeNumber(value);

  return `
    <div class="modal-score">

      <div class="modal-score-head">

        <span>${label}</span>

        <strong>
          ${safe}/100
        </strong>

      </div>

      <div class="bar">
        <i style="width:${safe}%"></i>
      </div>

    </div>
  `;
}


/* =========================================================
   KART
   ========================================================= */

function createCard(weapon,index){

  return `
    <article class="card">

      <div class="card-top">

        <div>

          <div class="weapon-name">
            ${weapon.name}
          </div>

          <div class="weapon-meta">
            ${weapon.category} • ${weapon.ammo}
          </div>

        </div>

        <div class="badge ${recoilClass(weapon.recoil)}">
          ${weapon.recoil} RECOIL
        </div>

      </div>


      <div class="scores">

        ${scoreHTML("Kontrol",weapon.control)}

        ${scoreHTML("Stabilite",weapon.stability)}

        ${scoreHTML("Yakın",weapon.close)}

      </div>


      <div class="sensitivity">

        <div class="sens">

          <small>CAMERA</small>

          <strong>
            ${weapon.camera}%
          </strong>

        </div>

        <div class="sens">

          <small>ADS</small>

          <strong>
            ${weapon.ads}%
          </strong>

        </div>

        <div class="sens">

          <small>GYRO</small>

          <strong>
            ${weapon.gyro}%
          </strong>

        </div>

      </div>


      <button
        class="open-btn"
        type="button"
        data-index="${index}"
      >
        AYARLARI GÖR →
      </button>

    </article>
  `;
}


/* =========================================================
   LİSTELEME
   ========================================================= */

function renderWeapons(){

  if(!Array.isArray(weapons)){

    grid.innerHTML = `
      <div class="empty">
        Silah verileri yüklenemedi.
      </div>
    `;

    return;
  }


  const query =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtered =
    weapons.filter(function(weapon){

      const matchesSearch =
        weapon.name
          .toLowerCase()
          .includes(query)

        ||

        weapon.category
          .toLowerCase()
          .includes(query)

        ||

        weapon.ammo
          .toLowerCase()
          .includes(query);


      const matchesFilter =
        currentFilter === "ALL" ||
        weapon.category === currentFilter;


      return matchesSearch && matchesFilter;

    });


  weaponCount.textContent =
    filtered.length;


  if(filtered.length === 0){

    grid.innerHTML = `
      <div class="empty">

        <div style="font-size:30px">
          🔎
        </div>

        <div style="margin-top:12px">
          <strong>Silah bulunamadı.</strong>
        </div>

        <div style="margin-top:6px">
          Arama kelimesini veya filtreyi değiştir.
        </div>

      </div>
    `;

    return;
  }


  grid.innerHTML =
    filtered
      .map(function(weapon){

        const index =
          weapons.indexOf(weapon);

        return createCard(
          weapon,
          index
        );

      })
      .join("");


  updateGlobalStats();

}


/* =========================================================
   İSTATİSTİK
   ========================================================= */

function updateGlobalStats(){

  if(!weapons.length){

    bestWeapon.textContent = "-";
    lowestRecoil.textContent = "-";

    return;
  }


  const stable =
    [...weapons]
      .sort(function(a,b){

        return b.stability - a.stability;

      })[0];


  const control =
    [...weapons]
      .sort(function(a,b){

        return b.control - a.control;

      })[0];


  bestWeapon.textContent =
    stable ? stable.name : "-";


  lowestRecoil.textContent =
    control ? control.name : "-";
}


/* =========================================================
   MODAL
   ========================================================= */

function openWeapon(index){

  const weapon =
    weapons[index];


  if(!weapon){
    return;
  }


  currentWeapon =
    weapon;


  modalTitle.textContent =
    weapon.name;


  mCamera.textContent =
    weapon.camera + "%";


  mAds.textContent =
    weapon.ads + "%";


  mGyro.textContent =
    weapon.gyro + "%";


  mMuzzle.textContent =
    weapon.muzzle;


  mGrip.textContent =
    weapon.grip;


  mMag.textContent =
    weapon.mag;


  scopeGrid.innerHTML =
    Object.entries(weapon.scopes)
      .map(function(entry){

        return `
          <div class="scope">

            <small>
              ${entry[0]}
            </small>

            <strong>
              ${entry[1]}%
            </strong>

          </div>
        `;

      })
      .join("");


  modalScores.innerHTML =

    modalScoreHTML(
      "Recoil Kontrolü",
      weapon.control
    )

    +

    modalScoreHTML(
      "Stabilite",
      weapon.stability
    )

    +

    modalScoreHTML(
      "Yakın Mesafe",
      weapon.close
    );


  document
    .querySelectorAll(".profile")
    .forEach(function(button){

      button.classList.remove("active");

    });


  const stable =
    document.querySelector(
      '[data-profile="STABLE"]'
    );


  if(stable){
    stable.classList.add("active");
  }


  modal.classList.add("show");

  modal.setAttribute(
    "aria-hidden",
    "false"
  );

  document.body.style.overflow =
    "hidden";
}


function closeModal(){

  modal.classList.remove("show");

  modal.setAttribute(
    "aria-hidden",
    "true"
  );

  document.body.style.overflow =
    "";

  currentWeapon = null;
}


/* =========================================================
   TOAST
   ========================================================= */

function showToast(message){

  toast.textContent =
    message;

  toast.classList.add("show");


  setTimeout(function(){

    toast.classList.remove("show");

  },1800);
}

   ========================================================= */

closeModalButton.addEventListener(
  "click",

);


modal.addEventListener(
  "click",
  function(event){

    if(event.target === modal){
      closeModal();

);


/* =========================================================
   PROFİLLER
   ========================================================= */

document
  .querySelectorAll(".profile")
  .forEach(function(button){

    button.addEventListener(
      "click",
      function(){

        if(!currentWeapon){
          return;
        }


        document
          .querySelectorAll(".profile")
          .forEach(function(item){

            item.classList.remove(
              "active"
            );

          });


        button.classList.add(
          "active"
        );


        const profile =
          button.dataset.profile;


        let multiplier = 1;


        if(profile === "STABLE"){
          multiplier = 0.96;
        }


        if(profile === "AGGRESSIVE"){
          multiplier = 1.08;
        }


        if(profile === "LONG"){
          multiplier = 0.90;
        }


        mCamera.textContent =
          Math.round(
            currentWeapon.camera *
            multiplier
          ) + "%";


        mAds.textContent =
          Math.round(
            currentWeapon.ads *
            multiplier
          ) + "%";


        mGyro.textContent =
          Math.round(
            currentWeapon.gyro *
            multiplier
          ) + "%";


        showToast(
          profile +
          " profili uygulandı."
        );

      }
    );

  });


/* =========================================================
   KAYDET
   ========================================================= */

saveButton.addEventListener(
  "click",
  function(){

    if(!currentWeapon){
      return;
    }


    const data = {

      weapon:
        currentWeapon.name,

      camera:
        mCamera.textContent,

      ads:
        mAds.textContent,

      gyro:
        mGyro.textContent,

      savedAt:
        Date.now()

    };


    localStorage.setItem(
      "aimverse_weapon_settings",
      JSON.stringify(data)
    );


    showToast(
      currentWeapon.name +
      " ayarları kaydedildi."
    );

  }
);


/* =========================================================
   SIFIRLA
   ========================================================= */

resetButton.addEventListener(
  "click",
  function(){

    if(!currentWeapon){
      return;
    }


    mCamera.textContent =
      currentWeapon.camera + "%";


    mAds.textContent =
      currentWeapon.ads + "%";


    mGyro.textContent =
      currentWeapon.gyro + "%";


    document
      .querySelectorAll(".profile")
      .forEach(function(item){

        item.classList.remove(
          "active"
        );

      });


    const stable =
      document.querySelector(
        '[data-profile="STABLE"]'
      );


    if(stable){
      stable.classList.add("active");
    }


    showToast(
      "Ayarlar sıfırlandı."
    );

  }
);

   BAŞLAT
   ========================================================= */

function init(){

  renderWeapons();

}


init();
